apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels: {app: demo}
spec:
  replicas: 1  # données dans un fichier sur le volume : une seule réplique
  strategy: {type: Recreate}  # volume RWO : l'ancien pod le libère avant le nouveau
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: demo-registry}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532  # nonroot (distroless)
        fsGroup: 65532  # nonroot (distroless)
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          image: registry.sty.ovh/demo/app:sha-f37c801a@sha256:15e8ae3dd4b2180210dd9a42fb0f28fdabf3176b722879989a3b080b9f8df999
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: APP_URL, value: https://demo.sty.ovh}
            - {name: SMTP_HOST, value: smtp.smtp.svc.cluster.local}
            - {name: SMTP_PORT, value: "587"}
            - {name: MAIL_FROM, value: noreply@sty.ovh}
            - {name: DATA_FILE, value: /data/demo.json}
            - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: demo-sso, key: issuer}}}
            - {name: OIDC_CLIENT_ID, valueFrom: {secretKeyRef: {name: demo-sso, key: client_id}}}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: demo-sso, key: client_secret}}}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: demo-data}
---
# Membres, invitations et clé de session de l'app.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 100Mi}
