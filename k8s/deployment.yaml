apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels: {app: demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false  # podinfo n'appelle pas l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # podinfo déclare un utilisateur par nom : uid explicite
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          image: "ghcr.io/stefanprodan/podinfo:6.15.0"
          ports:
            - {name: http, containerPort: 9898}
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
