apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels: {app: demo}
spec:
  replicas: 1  # comptes et invitations en mémoire : une seule réplique
  selector:
    matchLabels: {app: demo}
  template:
    metadata:
      labels: {app: demo}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: demo-registry}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: demo
          image: registry.sty.ovh/demo/app:sha-00000000
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: APP_URL, value: https://demo.sty.ovh}
            - {name: SMTP_HOST, value: smtp.smtp.svc.cluster.local}
            - {name: SMTP_PORT, value: "587"}
            - {name: MAIL_FROM, value: noreply@sty.ovh}
            - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: demo-sso, key: issuer}}}
            - {name: OIDC_CLIENT_ID, valueFrom: {secretKeyRef: {name: demo-sso, key: client_id}}}
            - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: demo-sso, key: client_secret}}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
