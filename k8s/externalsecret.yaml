# Secrets de l'application : nasty/secrets.enc.yaml, déchiffré par le portail dans Vault, lu ici par le
# SecretStore « vault » du namespace (créé par le portail) : secret/apps/demo/app.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: vault}
  target: {name: demo-app}
  dataFrom:
    - extract: {key: apps/demo/app}
