# Identifiants OIDC posés par Pilote (option sso) : client_id, client_secret, issuer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-sso
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: vault}
  target: {name: demo-sso}
  dataFrom:
    - extract: {key: apps/demo/sso}
---
# Robot Harbor créé par Pilote (option harbor) → secret de pull des images.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-registry
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: vault}
  target:
    name: demo-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef: {key: apps/demo/harbor, property: dockerconfigjson}
