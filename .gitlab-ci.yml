include:
  - {project: nas-sty/devops/ci-templates, ref: audit/v1.0.0-includes-locaux, file: base.yml}
  - {project: nas-sty/devops/ci-templates, ref: audit/v1.0.0-includes-locaux, file: docker-build.yml}
  - {project: nas-sty/devops/ci-templates, ref: audit/v1.0.0-includes-locaux, file: jobs/sbom.yml}
  - {project: nas-sty/devops/ci-templates, ref: audit/v1.0.0-includes-locaux, file: pilote.yml}  # annonce le build à Pilote (sans secret)
stages: [build, sbom]

variables:
  PUSH_LATEST: "false"

# Tests dans le Dockerfile. Image épinglée à la main dans k8s/deployment.yaml (sha-<court>).
build-image:
  stage: build
  extends: [.docker-build, .on-release-or-mr]
  variables:
    IMAGE: registry.sty.ovh/demo/app
    CONTEXT: app

sbom:
  stage: sbom
  extends: .sbom
  variables:
    IMAGE: registry.sty.ovh/demo/app
